<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f0e4">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2032%2032%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%229%22%20fill%3D%22%23773b45%22%2F%3E%3Cpath%20fill%3D%22%23fff4e4%22%20d%3D%22M16%2024.5%207.7%2016a5.2%205.2%200%200%201%207.4-7.3l.9%201%20.9-1a5.2%205.2%200%200%201%207.4%207.3z%22%2F%3E%3C%2Fsvg%3E">
<meta name="description" content="Интерактивная открытка для мамы с девятью пожеланиями и личным письмом.">
<title>Письмо для мамы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;display=swap">
<style>
:root {
  color-scheme: light;
  --ink:#352721; --muted:#6a5147; --wine:#773b45; --paper:#fffaf1;
  --border:#ddcdbd; --serif:Georgia,"Times New Roman",serif;
  font-family:system-ui,sans-serif; color:var(--ink); background:#f7f0e4;
}
* { box-sizing:border-box }
[hidden] { display:none!important }
body { margin:0; min-height:100svh; background:radial-gradient(ellipse at 50% 15%,#fffaf1 5%,transparent 66%),#f7f0e4 }
button,input,textarea { font:inherit; color:inherit }
button { cursor:pointer; touch-action:manipulation }
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible { outline:3px solid var(--wine); outline-offset:3px }
:focus-visible { outline-offset:4px }
.bar { max-width:1120px; margin:auto; min-height:74px; padding:12px clamp(14px,4vw,32px); display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid var(--border) }
.brand { display:flex; align-items:center; gap:8px; font:italic 1.15rem var(--serif) }
.brand svg { display:block; width:32px; height:32px; flex:none }
button { min-height:44px; border-radius:100px; padding:9px 16px; border:1px solid var(--border); background:var(--paper); font-weight:650 }
button:hover { border-color:var(--wine) }
.primary { background:var(--wine); color:white; border-color:var(--wine); padding-inline:23px }
main { max-width:700px; margin:auto; padding:clamp(22px,5vw,42px) 14px max(24px,env(safe-area-inset-bottom)); text-align:center }
.scene { position:relative; isolation:isolate; overflow:hidden; background:linear-gradient(155deg,#fffaf2,#f6e9d8); border:1px solid var(--border); border-radius:30px; padding:clamp(25px,6vw,56px) clamp(14px,5vw,45px); box-shadow:0 22px 55px #673e2512 }
.scene:before { content:""; position:absolute; inset:8px; border:1px solid #b4927740; border-radius:23px; z-index:-1; pointer-events:none }
h1,h2,p { margin:0 }
h1,h2 { font:normal clamp(2.15rem,7vw,4.7rem)/1.02 var(--serif); overflow-wrap:anywhere; letter-spacing:-.055em }
h2 { font-size:clamp(2rem,6vw,3.45rem) }
.intro { margin:13px auto 0; color:var(--muted); line-height:1.55 }
.kicker { color:var(--wine); letter-spacing:.15em; text-transform:uppercase; font-weight:700; font-size:.68rem; margin-bottom:16px }
.cover { display:grid; justify-items:center }
.art { position:relative; width:min(100%,410px); height:clamp(185px,46vw,270px); margin:13px auto 16px; display:grid; place-items:center }
.spark { position:absolute; font:1.7rem var(--serif); color:#a16d5d; left:9%;top:21% }
.spark:last-child { left:auto;right:8%;top:67%;font-size:1.2rem }
.envelope { width:73%; aspect-ratio:1.58; position:relative; background:#e2bb94; border-radius:5px; transform:rotate(-6deg); box-shadow:0 16px 30px #59432f40; perspective:700px }
.envelope:before { content:""; position:absolute; inset:0; background:linear-gradient(135deg,#ebcbab,#cda987); clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%) }
.envelope:after { content:""; position:absolute; inset:0; background:linear-gradient(160deg,#f1d6b8,#d9ab84); clip-path:polygon(0 100%,50% 49%,100% 100%) }
.flap { position:absolute; z-index:2; inset:0; background:linear-gradient(166deg,#f5ddc3,#d6a57d); clip-path:polygon(0 0,100% 0,55% 60%,50% 64%,45% 60%); transform-origin:top; transition:transform .5s }
.seal { position:absolute; z-index:3; top:56%;left:50%; translate:-50% -50%; display:grid; place-items:center; width:clamp(38px,11vw,64px); aspect-ratio:1; color:#fff1d9; background:radial-gradient(circle,#99505c 55%,#71333d 57%,#a55e66 65%,#73353f 68%); border-radius:48%; border:2px solid #7d3c44; box-shadow:0 4px 8px #461b2655; font-size:clamp(18px,5vw,30px); transition:opacity .2s }
.opening .flap { transform:rotateX(163deg) }
.opening .seal { opacity:0 }
.notes {
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(19px,5.8vw,37px) clamp(12px,4vw,28px);
  margin:28px auto; max-width:470px; padding:7px 6px;
}
.note {
  display:block; width:100%; padding:0; border:0;
  border-radius:5px; background:transparent;
}
.mini-envelope {
  position:relative; display:block; width:100%;
  aspect-ratio:1.28; border-radius:5px;
  border:1px solid #fff8edaa;
  background:linear-gradient(to bottom,#fff8 0%,#fff0 56%,#69553a24 57%,#fff3 59%,#fff0 100%),var(--note-paper);
  box-shadow:0 7px 13px #6f493d35;
  rotate:var(--tilt); transition:transform .25s ease;
}
.mini-envelope::before {
  content:""; position:absolute; top:-8%; left:50%; translate:-50% 0;
  width:38%; height:15%; border-radius:1px; rotate:-3deg;
  background:repeating-linear-gradient(90deg,#fff5 0 4px,transparent 4px 8px),var(--note-tape);
}
.mini-seal {
  position:absolute; top:58%; left:50%; translate:-50% -50%;
  color:#ad364d; font:700 clamp(1.35rem,5.8vw,2.1rem)/1 var(--serif);
  filter:drop-shadow(0 1px 1px #793c4250);
}
.note:hover .mini-envelope { transform:translateY(-4px) }
.note:active .mini-envelope { transform:scale(.95) }
.wish-text {
  margin:0; text-align:center; text-wrap:pretty;
  color:#36493b;
  font-family:"Caveat","Segoe Print","Comic Sans MS",cursive; font-weight:600;
  font-size:clamp(1.75rem,7vw,2.65rem); font-style:normal; line-height:1.18;
  white-space:pre-wrap; overflow-wrap:anywhere;
}
#note-dialog[open] { text-align:center; animation:unfold .39s both }
.wish-accessible {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip-path:inset(50%); white-space:nowrap;
}
#note-dialog[open] .ink-letter {
  animation:ink-appear .16s linear both;
  animation-delay:var(--ink-time);
}
@keyframes ink-appear {
  from { opacity:0 }
  to { opacity:1 }
}
#letter:not([hidden]) .final { animation:unfold .65s both }
#letter:not([hidden]) .photo { animation:appear .65s .20s both }
#letter:not([hidden]) h2 { animation:appear .52s .30s both }
#letter:not([hidden]) .letter-text { animation:reveal 1.05s .45s both }
#letter:not([hidden]) .signature { animation:appear .6s .82s both }
#letter:not([hidden]) #restart { animation:appear .45s 1.02s both }
.cover:not(.opening) .envelope { animation:float 4.8s ease-in-out infinite }
.opening .envelope { animation:open-envelope .7s ease both }
.opening .spark { animation:spark-out .65s ease both }
@keyframes appear { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
@keyframes reveal { from { opacity:0; clip-path:inset(0 0 100%); transform:translateY(8px) } to { opacity:1; clip-path:inset(0 0 0); transform:translateY(0) } }
@keyframes unfold { from { opacity:0; transform:perspective(750px) translateY(22px) rotateX(-17deg) scale(.95) } to { opacity:1; transform:perspective(750px) translateY(0) rotateX(0) scale(1) } }
@keyframes float { 0%,100% { transform:translateY(0) rotate(-6deg) } 50% { transform:translateY(-7px) rotate(-4deg) } }
@keyframes open-envelope { 0% { transform:rotate(-6deg) } 52% { transform:translateY(-9px) rotate(0) scale(1.04) } 100% { transform:translateY(15px) rotate(0) scale(.98); opacity:0 } }
@keyframes spark-out { from { opacity:1; transform:scale(.75) } to { opacity:0; transform:translateY(-28px) rotate(40deg) scale(1.65) } }
.progress { margin-top:8px; color:var(--muted); font-size:.85rem }
.final { max-width:470px; margin:auto; padding:clamp(16px,4vw,32px); background:#fffaf2; border:1px solid var(--border); border-radius:4px 4px 24px 4px; box-shadow:0 8px 20px #593e2519 }
.photo { display:block; width:100%; height:auto; margin:0 auto 20px; border:4px solid white; box-shadow:0 3px 12px #593e2530 }
.letter-text { font:italic clamp(1.25rem,4vw,1.8rem)/1.5 var(--serif); white-space:pre-wrap; overflow-wrap:anywhere; margin:17px auto }
.signature { color:var(--wine); white-space:pre-wrap; overflow-wrap:anywhere; margin-bottom:18px }
dialog { color:var(--ink); width:min(calc(100% - 24px),535px); max-height:calc(100% - 24px); border:1px solid var(--border); border-radius:22px; padding:clamp(16px,4vw,29px); background:var(--paper); box-shadow:0 20px 80px #2b1c1950 }
dialog::backdrop { background:#33211db0; backdrop-filter:blur(4px) }
.dialog-top { display:flex; align-items:start; justify-content:space-between; gap:10px }
.close { padding:0; min-width:44px; font-size:1.4rem }
.falling,.flight-layer {
  position:fixed; inset:0; pointer-events:none; overflow:hidden;
}
.falling { z-index:0 }
.bar,main { position:relative; z-index:1 }
.falling .particle {
  position:absolute; top:-24px; left:var(--x);
  animation:fall var(--duration) var(--delay) linear infinite;
}
.particle.heart { font-size:var(--size); line-height:1; color:#ab465b; }
.particle.petal {
  width:var(--size); aspect-ratio:.73; border-radius:70% 35% 72% 28%;
  border-top:1px solid #e293a2;
  background:radial-gradient(at 25% 25%,#f5cad1,#da8397 70%,#aa5067);
}
@keyframes fall {
  0% { transform:translate3d(0,-5vh,0) rotate(-25deg); opacity:0 }
  12%,84% { opacity:.36 }
  52% { transform:translate3d(var(--drift),53vh,0) rotate(115deg) }
  100% { transform:translate3d(0,111vh,0) rotate(280deg); opacity:0 }
}
.flight-layer { z-index:6 }
.flight-layer .mini-envelope { position:absolute; transition:none }
.note.in-flight { visibility:hidden }
#note-dialog {
  --paper-line:clamp(30px,8vw,39px);
  --paper-margin:clamp(21px,7vw,37px);
  width:min(calc(100% - 24px),510px);
  border:0; padding:15px 0 0; overflow:visible;
  border-radius:0; background:transparent; box-shadow:none;
}
#note-dialog::backdrop { background:#4f2e36a6 }
.wish-paper {
  width:100%; text-align:center; border-radius:8px;
  position:relative; isolation:isolate;
  display:grid; gap:clamp(13px,4vw,24px);
  max-height:calc(100dvh - 46px); overflow:auto;
  padding:clamp(19px,5.5vw,32px) clamp(14px,5vw,29px) 12px calc(var(--paper-margin) + 14px);
  border:1px solid #b6c8a6; border-radius:8px;
  background:
    linear-gradient(90deg,transparent calc(var(--paper-margin) - 1px),#a96f75a1 var(--paper-margin),transparent calc(var(--paper-margin) + 1px)),
    linear-gradient(transparent 48%,#546a5420 50%,#ffffff55 51%,transparent 52%),
    repeating-linear-gradient(to bottom,transparent 0 calc(var(--paper-line) - 1px),#65856d31 calc(var(--paper-line) - 1px) var(--paper-line)),
    linear-gradient(155deg,#ecf2dd,#dbe7ce);
  box-shadow:0 20px 48px #30262263;
}
.wish-tape {
  position:absolute; top:2px; left:50%; translate:-50% 0; z-index:1;
  width:clamp(76px,26%,126px); height:25px; rotate:-3deg;
  background:repeating-linear-gradient(90deg,#fff3cb74 0 5px,transparent 5px 10px),#e1a54ac9;
  box-shadow:0 2px 3px #76532f26;
  clip-path:polygon(0 7%,100% 0,98% 92%,2% 100%);
  pointer-events:none;
}
#note-title { align-self:center; margin:0; text-align:left }
.wish-text {
  display:grid; align-items:center; min-height:clamp(126px,35vw,176px);
  padding:clamp(8px,3vw,16px) 0;
}
.fold-wish {
  justify-self:end; color:#415b48;
  font:500 .84rem/1.35 system-ui,sans-serif;
}
@media(prefers-reduced-motion:reduce) { .falling,.flight-layer { display:none } }
@media(max-width:380px) { .bar button { font-size:.8rem; padding-inline:10px } .brand { font-size:1rem } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; animation:none!important } }
</style>
</head>
<body>
<div id="falling" class="falling" aria-hidden="true"></div>
<header class="bar">
  <div class="brand"><svg aria-hidden="true" focusable="false" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="9" fill="#773b45"/><path fill="#fff4e4" d="M16 24.5 7.7 16a5.2 5.2 0 0 1 7.4-7.3l.9 1 .9-1a5.2 5.2 0 0 1 7.4 7.3z"/></svg> Почта для мамы</div>
</header>
<main>
  <section class="scene cover" id="cover" aria-labelledby="cover-title">
    <p class="kicker">От всего сердца</p>
    <h1 id="cover-title" tabindex="-1"><span id="cover-name">Мама</span>,<br>это тебе</h1>
    <p class="intro">Девять тёплых пожеланий для тебя.</p>
    <div class="art" aria-hidden="true">
      <span class="spark">✧</span>
      <div class="envelope"><span class="flap"></span><span class="seal">♥</span></div>
      <span class="spark">✦</span>
    </div>
    <button class="primary" id="open" type="button">Открыть конверт <span aria-hidden="true">↗</span></button>
  </section>
  <section class="scene" id="notes" aria-labelledby="notes-title" hidden>
    <p class="kicker">Из конверта</p>
    <h2 id="notes-title" tabindex="-1">Девять пожеланий</h2>
    <p class="intro">Открывай конвертики в любом порядке.</p>
    <p class="progress" id="progress" aria-live="polite"></p>
    <div class="notes" id="grid"></div>
    <button class="primary" id="show-final" type="button" hidden>Прочитать письмо</button>
  </section>
  <section class="scene" id="letter" aria-labelledby="letter-title" hidden>
    <div class="final">
      <p class="kicker">Самое важное</p>
      <img class="photo" src="./photo.jpg" width="900" height="675" alt="Мама и дочка вместе" decoding="async">
      <h2 id="letter-title" tabindex="-1"></h2>
      <p id="message" class="letter-text"></p>
      <p id="signature" class="signature"></p>
      <button id="restart" type="button">Открыть сначала</button>
    </div>
  </section>
</main>
<dialog id="note-dialog" aria-labelledby="note-title">
  <span class="wish-tape" aria-hidden="true"></span>
  <button type="button" class="wish-paper" id="fold-wish" aria-describedby="note-text">
    <span class="kicker" id="note-title"></span>
    <span id="note-text" class="wish-accessible"></span>
    <span class="wish-text" aria-hidden="true"><span id="wish-ink"></span></span>
    <span class="fold-wish">Нажмите, чтобы сложить</span>
  </button>
</dialog>
<script>
"use strict";
const $ = id => document.getElementById(id);
const defaults = {
  name:"Мама",
  notes:[
    "Мама, желаю тебе крепкого здоровья и побольше дней, когда ты полна сил.",
    "Пусть у тебя всегда будет время на то, что ты любишь.",
    "Желаю тебе спокойных утр, когда можно допить чай горячим и никуда не спешить.",
    "Пусть будет больше поводов смеяться до слёз.",
    "Желаю, чтобы рядом всегда были люди, с которыми тебе спокойно и хорошо.",
    "Пусть сбывается то, о чём ты давно мечтаешь.",
    "Желаю тебе чаще слышать, как сильно тебя любят и ценят.",
    "Пусть даже в самый обычный день найдётся повод улыбнуться.",
    "Желаю нам побольше встреч, долгих разговоров и крепких объятий."
  ],
  message:"Спасибо, что ты у меня есть. Я не всегда успеваю это сказать, но очень тебя люблю.",
  signature:"С любовью, твоя дочка"
};
const noteDialog = $("note-dialog");
let seen = new Set();
let opening = false;

let card = defaults;

async function loadSharedText() {
  const params = new URLSearchParams(location.hash.slice(1));
  const plain = params.get("letter");
  const compressed = params.get("card");
  if (!plain && !compressed) return;
  try {
    const code = plain || compressed;
    const bytes = Uint8Array.from(atob(code.replaceAll("-", "+").replaceAll("_", "/")), value => value.charCodeAt(0));
    const parsed = plain
      ? JSON.parse(new TextDecoder().decode(bytes))
      : await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).json();
    const text = (value, length, fallback) =>
      typeof value === "string" ? value.trim().slice(0, length) || fallback : fallback;
    card = {
      name:text(parsed?.name, 40, defaults.name),
      notes:defaults.notes.map((note, index) => text(parsed?.notes?.[index], 180, note)),
      message:text(parsed?.message, 500, defaults.message),
      signature:typeof parsed?.signature === "string" ? parsed.signature.trim().slice(0, 65) : defaults.signature
    };
  } catch {
    // An incomplete older link opens the default card.
  }
}
function show(screen, focus = true) {
  for (const id of ["cover", "notes", "letter"]) $(id).hidden = id !== screen;
  if (focus) {
    $(screen).querySelector("h1,h2").focus({preventScroll:true});
    window.scrollTo(0, 0);
  }
}
function renderProgress() {
  $("progress").textContent = "Открыто " + seen.size + " из " + card.notes.length;
  $("show-final").hidden = seen.size !== card.notes.length;
  Array.from($("grid").children).forEach((button, index) => {
    const read = seen.has(index);
    button.dataset.read = read;
    button.querySelector(".mini-seal").textContent = read ? "♡" : "♥";
    button.setAttribute("aria-label", (read ? "Перечитать пожелание" : "Открыть пожелание") + " " + (index + 1));
  });
}
function renderCard() {
  $("cover-name").textContent = card.name;
  $("letter-title").textContent = card.name + ",";
  $("message").textContent = card.message;
  $("signature").textContent = card.signature;
  $("signature").hidden = !card.signature;
  seen = new Set();
  renderProgress();
  show("cover", false);
}
const paperColors = [
  ["#f7e3a8", "#cb7d86", -7], ["#f3c8d0", "#82a896", 3],
  ["#d8e9d4", "#dca54c", 7], ["#d9dff5", "#8b9cc6", 6],
  ["#f7d9ae", "#df9662", -6], ["#ead8ef", "#ad7eb0", -3],
  ["#d3e9ee", "#77aeb9", 5], ["#f5dfb8", "#ca7b85", -7],
  ["#e2ebc7", "#d6a43c", 2]
];
card.notes.forEach((_, index) => {
  const button = document.createElement("button");
  button.className = "note";
  button.type = "button";
  const envelope = document.createElement("span");
  envelope.className = "mini-envelope";
  const [paper, tape, tilt] = paperColors[index];
  envelope.style.setProperty("--note-paper", paper);
  envelope.style.setProperty("--note-tape", tape);
  envelope.style.setProperty("--tilt", tilt + "deg");
  envelope.setAttribute("aria-hidden", "true");
  const heart = document.createElement("span");
  heart.className = "mini-seal";
  heart.textContent = "♥";
  envelope.append(heart);
  button.append(envelope);
  button.addEventListener("click", () => {
    seen.add(index);
    renderProgress();
    $("note-title").textContent = "Пожелание " + (index + 1) + " из " + card.notes.length;
    writeWish(card.notes[index]);
    noteDialog.showModal();
  });
  $("grid").append(button);

});

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

function writeWish(text) {
  $("note-text").textContent = text;
  const ink = $("wish-ink");
  if (reducedMotion.matches) {
    ink.textContent = text;
    return;
  }

  const letters = Array.from(text);
  const pace = Math.min(39, 2900 / letters.length);
  const fragment = document.createDocumentFragment();
  let time = 280;
  for (const [index, letter] of letters.entries()) {
    if (/\s/u.test(letter)) {
      fragment.append(letter);
      time += pace * .45;
      continue;
    }
    const glyph = document.createElement("span");
    glyph.className = "ink-letter";
    glyph.style.setProperty("--ink-time", Math.round(time) + "ms");
    glyph.textContent = letter;
    fragment.append(glyph);
    time += /[,.!?…:;—]/u.test(letter) ? pace * 2.65 : pace * (.79 + index % 5 * .1);
  }
  ink.replaceChildren(fragment);
}

function flyEnvelopes(origin) {
  const buttons = Array.from($("grid").children);
  const layer = document.createElement("div");
  layer.className = "flight-layer";
  layer.setAttribute("aria-hidden", "true");
  document.body.append(layer);
  $("grid").inert = true;

  const flights = buttons.map((button, index) => {
    const icon = button.querySelector(".mini-envelope");
    const target = icon.getBoundingClientRect();
    const fly = icon.cloneNode(true);
    fly.style.left = target.left + (target.width - icon.offsetWidth) / 2 + "px";
    fly.style.top = target.top + (target.height - icon.offsetHeight) / 2 + "px";
    fly.style.width = icon.offsetWidth + "px";
    layer.append(fly);
    button.classList.add("in-flight");
    const dx = origin.x - (target.left + target.width / 2);
    const dy = origin.y - (target.top + target.height / 2);
    const side = index % 3 - 1;
    const animation = fly.animate([
      { transform:`translate(${dx}px, ${dy}px) scale(.28)`, opacity:0 },
      { transform:`translate(${dx * .48 + side * 53}px, ${dy * .5 - 66}px) rotate(${side * 25}deg) scale(.9)`, opacity:1, offset:.55 },
      { transform:"translate(0, 0) rotate(0) scale(1)", opacity:1 }
    ], { duration:690, delay:index * 52, easing:"cubic-bezier(.22,.65,.33,1)", fill:"both" });
    return animation.finished.catch(() => {}).finally(() => {
      button.classList.remove("in-flight");
      fly.remove();
    });
  });
  return Promise.all(flights).finally(() => {
    $("grid").inert = false;
    layer.remove();
  });
}

$("open").addEventListener("click", async () => {
  if (opening) return;
  opening = true;
  if (reducedMotion.matches) {
    show("notes");
    opening = false;
    return;
  }
  $("cover").classList.add("opening");
  await new Promise(resolve => setTimeout(resolve, 470));
  const rect = $("cover").querySelector(".envelope").getBoundingClientRect();
  $("cover").classList.remove("opening");
  show("notes");
  await flyEnvelopes({x:rect.left + rect.width / 2, y:rect.top + rect.height * .45});
  opening = false;
});
$("fold-wish").onclick = async () => {
  const paper = $("fold-wish");
  if (paper.disabled) return;
  if (reducedMotion.matches) {
    noteDialog.close();
    return;
  }
  paper.disabled = true;
  try {
    await paper.animate([
      { opacity:1, transform:"perspective(650px) rotateX(0)" },
      { opacity:0, transform:"perspective(650px) rotateX(-68deg) scale(.9)" }
    ], { duration:235, easing:"ease-in", fill:"forwards" }).finished;
    noteDialog.close();
  } finally {
    paper.getAnimations().forEach(animation => animation.cancel());
    paper.disabled = false;
  }
};
$("show-final").onclick = () => show("letter");
$("restart").onclick = () => {
  seen.clear();
  renderProgress();
  show("cover");
};
function createFallingDecor() {
  const decor = $("falling");
  for (let index = 0; index < 20; index++) {
    const particle = document.createElement("span");
    const isHeart = index % 3 === 0;
    particle.className = isHeart ? "particle heart" : "particle petal";
    particle.textContent = isHeart ? "♥" : "";
    particle.style.setProperty("--x", (index * 43 % 100) + "%");
    particle.style.setProperty("--size", (8 + index * 7 % 13) + "px");
    particle.style.setProperty("--drift", (index % 2 ? 1 : -1) * (18 + index * 9 % 56) + "px");
    particle.style.setProperty("--duration", (11 + index * 3 % 10) + "s");
    particle.style.setProperty("--delay", -(index * 4 % 19) + "s");
    decor.append(particle);
  }
}
createFallingDecor();
loadSharedText().then(renderCard);
</script>
