<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f0e4">
<meta name="description" content="Интерактивная открытка для мамы с девятью записками и личным письмом.">
<title>Письмо для мамы</title>
<style>
:root {
  color-scheme: light;
  --ink:#352721; --muted:#6a5147; --wine:#773b45; --paper:#fffaf1;
  --border:#ddcdbd; --serif:Georgia,"Times New Roman",serif;
  font-family:system-ui,sans-serif; color:var(--ink); background:#f7f0e4;
}
* { box-sizing:border-box }
[hidden] { display:none!important }
body { margin:0; min-height:100svh; background:radial-gradient(ellipse at 50% 15%,#fffaf1 5%,transparent 66%),#f7f0e4 }
button,input,textarea { font:inherit; color:inherit }
button { cursor:pointer; touch-action:manipulation }
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible { outline:3px solid var(--wine); outline-offset:3px }
:focus-visible { outline-offset:4px }
.bar { max-width:1120px; margin:auto; min-height:74px; padding:12px clamp(14px,4vw,32px); display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid var(--border) }
.brand { display:flex; align-items:center; gap:8px; font:italic 1.15rem var(--serif) }
.brand span { color:var(--wine) }
button { min-height:44px; border-radius:100px; padding:9px 16px; border:1px solid var(--border); background:var(--paper); font-weight:650 }
button:hover { border-color:var(--wine) }
.primary { background:var(--wine); color:white; border-color:var(--wine); padding-inline:23px }
main { max-width:700px; margin:auto; padding:clamp(22px,5vw,42px) 14px max(24px,env(safe-area-inset-bottom)); text-align:center }
.scene { position:relative; isolation:isolate; overflow:hidden; background:linear-gradient(155deg,#fffaf2,#f6e9d8); border:1px solid var(--border); border-radius:30px; padding:clamp(25px,6vw,56px) clamp(14px,5vw,45px); box-shadow:0 22px 55px #673e2512 }
.scene:before { content:""; position:absolute; inset:8px; border:1px solid #b4927740; border-radius:23px; z-index:-1; pointer-events:none }
h1,h2,p { margin:0 }
h1,h2 { font:normal clamp(2.15rem,7vw,4.7rem)/1.02 var(--serif); overflow-wrap:anywhere; letter-spacing:-.055em }
h2 { font-size:clamp(2rem,6vw,3.45rem) }
.intro { margin:13px auto 0; color:var(--muted); line-height:1.55 }
.kicker { color:var(--wine); letter-spacing:.15em; text-transform:uppercase; font-weight:700; font-size:.68rem; margin-bottom:16px }
.cover { display:grid; justify-items:center }
.art { position:relative; width:min(100%,410px); height:clamp(185px,46vw,270px); margin:13px auto 16px; display:grid; place-items:center }
.spark { position:absolute; font:1.7rem var(--serif); color:#a16d5d; left:9%;top:21% }
.spark:last-child { left:auto;right:8%;top:67%;font-size:1.2rem }
.envelope { width:73%; aspect-ratio:1.58; position:relative; background:#e2bb94; border-radius:5px; transform:rotate(-6deg); box-shadow:0 16px 30px #59432f40; perspective:700px }
.envelope:before { content:""; position:absolute; inset:0; background:linear-gradient(135deg,#ebcbab,#cda987); clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%) }
.envelope:after { content:""; position:absolute; inset:0; background:linear-gradient(160deg,#f1d6b8,#d9ab84); clip-path:polygon(0 100%,50% 49%,100% 100%) }
.flap { position:absolute; z-index:2; inset:0; background:linear-gradient(166deg,#f5ddc3,#d6a57d); clip-path:polygon(0 0,100% 0,55% 60%,50% 64%,45% 60%); transform-origin:top; transition:transform .5s }
.seal { position:absolute; z-index:3; top:56%;left:50%; translate:-50% -50%; display:grid; place-items:center; width:clamp(38px,11vw,64px); aspect-ratio:1; color:#fff1d9; background:radial-gradient(circle,#99505c 55%,#71333d 57%,#a55e66 65%,#73353f 68%); border-radius:48%; border:2px solid #7d3c44; box-shadow:0 4px 8px #461b2655; font-size:clamp(18px,5vw,30px); transition:opacity .2s }
.opening .flap { transform:rotateX(163deg) }
.opening .seal { opacity:0 }
.notes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(7px,2vw,15px); margin:23px auto; max-width:450px }
.note { position:relative; display:grid; justify-items:center; align-content:center; gap:2px; min-height:clamp(65px,17vw,107px); padding:5px; border-radius:5px 5px 18px 5px; background:#ead7c0; color:#632f3d; box-shadow:0 4px 7px #79573820 }
.note:nth-child(3n+2) { background:#efdadc }
.note:nth-child(3n+3) { background:#dce4d7 }
.note[data-read=true] { box-shadow:inset 0 0 0 2px #85505a }
.note strong { font:normal clamp(1.4rem,5vw,2rem) var(--serif) }
.note small { font-size:.7rem }
.progress { margin-top:8px; color:var(--muted); font-size:.85rem }
.final { max-width:470px; margin:auto; padding:clamp(16px,4vw,32px); background:#fffaf2; border:1px solid var(--border); border-radius:4px 4px 24px 4px; box-shadow:0 8px 20px #593e2519 }
.photo { display:block; width:min(100%,310px); max-height:44svh; object-fit:contain; margin:0 auto 20px; background:#f3e8db; border:7px solid white; box-shadow:0 3px 12px #593e2530 }
.letter-text { font:italic clamp(1.25rem,4vw,1.8rem)/1.5 var(--serif); white-space:pre-wrap; overflow-wrap:anywhere; margin:17px auto }
.signature { color:var(--wine); white-space:pre-wrap; overflow-wrap:anywhere; margin-bottom:18px }
dialog { color:var(--ink); width:min(calc(100% - 24px),535px); max-height:calc(100% - 24px); border:1px solid var(--border); border-radius:22px; padding:clamp(16px,4vw,29px); background:var(--paper); box-shadow:0 20px 80px #2b1c1950 }
dialog::backdrop { background:#33211db0; backdrop-filter:blur(4px) }
.dialog-top { display:flex; align-items:start; justify-content:space-between; gap:10px }
.close { padding:0; min-width:44px; font-size:1.4rem }
#editor-title { font-size:clamp(1.9rem,6vw,2.8rem) }
form { margin-top:18px; display:grid; gap:15px }
label { display:grid; gap:5px; font-weight:650; font-size:.91rem }
input,textarea { min-width:0; width:100%; border:1px solid var(--border); border-radius:10px; padding:10px; background:white; font-size:16px }
textarea { resize:vertical }
details { border:1px solid var(--border); border-radius:12px; padding:10px 12px }
summary { cursor:pointer; font-weight:650; min-height:28px }
#note-fields { display:grid; gap:10px }
.actions { display:flex; flex-wrap:wrap; gap:8px }
.hint { color:var(--muted); font-size:.82rem; line-height:1.5 }
#feedback { min-height:1em }
@media(max-width:380px) { .bar button { font-size:.8rem; padding-inline:10px } .brand { font-size:1rem } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span aria-hidden="true">♥</span> Почта для мамы</div>
  <button id="edit" type="button">Настроить открытку</button>
</header>
<main>
  <section class="scene cover" id="cover" aria-labelledby="cover-title">
    <p class="kicker">От всего сердца</p>
    <h1 id="cover-title" tabindex="-1"><span id="cover-name">Мама</span>,<br>это тебе</h1>
    <p class="intro">Девять маленьких поводов сказать спасибо.</p>
    <div class="art" aria-hidden="true">
      <span class="spark">✧</span>
      <div class="envelope"><span class="flap"></span><span class="seal">♥</span></div>
      <span class="spark">✦</span>
    </div>
    <button class="primary" id="open" type="button">Открыть конверт <span aria-hidden="true">↗</span></button>
  </section>
  <section class="scene" id="notes" aria-labelledby="notes-title" hidden>
    <p class="kicker">Из конверта</p>
    <h2 id="notes-title" tabindex="-1">Девять записок</h2>
    <p class="intro">Открывай в любом порядке.</p>
    <p class="progress" id="progress" aria-live="polite"></p>
    <div class="notes" id="grid"></div>
    <button class="primary" id="show-final" type="button" hidden>Прочитать письмо</button>
  </section>
  <section class="scene" id="letter" aria-labelledby="letter-title" hidden>
    <div class="final">
      <p class="kicker">Самое важное</p>
      <img id="photo" class="photo" alt="Фото в открытке" hidden>
      <h2 id="letter-title" tabindex="-1"></h2>
      <p id="message" class="letter-text"></p>
      <p id="signature" class="signature"></p>
      <button id="restart" type="button">Открыть сначала</button>
    </div>
  </section>
</main>
<dialog id="note-dialog" aria-labelledby="note-title">
  <div class="dialog-top">
    <p class="kicker" id="note-title"></p>
    <button class="close" id="close-note" type="button" aria-label="Закрыть записку">×</button>
  </div>
  <p id="note-text" class="letter-text"></p>
  <button class="primary" id="next-note" type="button">К запискам</button>
</dialog>
<dialog id="editor" aria-labelledby="editor-title">
  <div class="dialog-top">
    <h2 id="editor-title">Твоя открытка</h2>
    <button class="close" id="close-editor" type="button" aria-label="Закрыть редактор">×</button>
  </div>
  <form id="form">
    <label>Обращение <input name="name" maxlength="40" required></label>
    <details><summary>Девять записок</summary><div id="note-fields"></div></details>
    <label>Финальное письмо <textarea name="message" maxlength="500" rows="4" required></textarea></label>
    <label>Подпись <input name="signature" maxlength="65"></label>
    <label>Фото для письма <input id="file" type="file" accept="image/*"></label>
    <button type="button" id="remove-photo" hidden>Убрать фото</button>
    <p class="hint">Ссылка передаёт текст. Чтобы отправить открытку с фото, скачай HTML-файл и отправь его целиком.</p>
    <div class="actions">
      <button class="primary" id="preview" type="submit">Посмотреть</button>
      <button id="share" type="submit">Скопировать ссылку</button>
      <button id="download" type="submit">Скачать открытку</button>
    </div>
    <label id="manual-share" hidden>Скопируй ссылку <input id="share-url" readonly></label>
    <p class="hint" id="feedback" role="status"></p>
  </form>
</dialog>
<script>
"use strict";
const original = document.documentElement.cloneNode(true);
const $ = id => document.getElementById(id);
const defaults = {
  name:"Мама",
  notes:[
    "Спасибо за то, что рядом с тобой я всегда чувствую себя дома.",
    "За то, что умеешь выслушать, даже когда у меня нет нужных слов.",
    "За наши разговоры на кухне, когда чай давно остыл.",
    "За смех, который я узнаю из любой комнаты.",
    "За то, что верила в меня, когда я сам сомневался.",
    "За простое «напиши, как доедешь». В нём столько заботы.",
    "За всё, чему ты научила меня своим примером.",
    "За объятия, после которых даже трудный день становится легче.",
    "За то, что рядом с тобой можно просто быть собой."
  ],
  message:"Спасибо, что ты у меня есть. Я не всегда успеваю это сказать, но очень тебя люблю.",
  signature:"С любовью",
  photo:""
};
const photoPattern = /^data:image\/jpeg;base64,[\w+/=]+$/;
const form = $("form");
const editor = $("editor");
const noteDialog = $("note-dialog");
let seen = new Set();
let draftPhoto = "";
let photoRequest = 0;
let opening = false;

function encode(value) {
  const bytes = new TextEncoder().encode(JSON.stringify(value));
  return btoa(Array.from(bytes, byte => String.fromCharCode(byte)).join(""))
    .replaceAll("+", "-").replaceAll("/", "_").replace(/=+$/, "");
}
function decode(value) {
  const bytes = Uint8Array.from(atob(value.replaceAll("-", "+").replaceAll("_", "/")), char => char.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function normalize(value) {
  const field = (text, limit, fallback) => typeof text === "string" ? text.trim().slice(0, limit) || fallback : fallback;
  return {
    name:field(value?.name, 40, defaults.name),
    notes:defaults.notes.map((note, index) => field(value?.notes?.[index], 180, note)),
    message:field(value?.message, 500, defaults.message),
    signature:field(value?.signature, 65, ""),
    photo:typeof value?.photo === "string" && value.photo.length < 2000000 && photoPattern.test(value.photo) ? value.photo : ""
  };
}
const embedded = document.documentElement.dataset.letter;
const shared = location.hash.startsWith("#letter=") ? location.hash.slice(8) : "";
let card = normalize(defaults);
if (embedded || shared) {
  try {
    const parsed = decode(embedded || shared);
    card = normalize(embedded ? parsed : { ...parsed, photo:"" });
    $("edit").hidden = true;
  } catch {
    // An incomplete link falls back to the example.
  }
}
function show(screen, focus = true) {
  for (const id of ["cover", "notes", "letter"]) $(id).hidden = id !== screen;
  if (focus) {
    $(screen).querySelector("h1,h2").focus({preventScroll:true});
    window.scrollTo(0, 0);
  }
}
function renderProgress() {
  $("progress").textContent = "Прочитано " + seen.size + " из " + card.notes.length;
  $("show-final").hidden = seen.size !== card.notes.length;
  Array.from($("grid").children).forEach((button, index) => {
    const read = seen.has(index);
    button.dataset.read = read;
    button.querySelector("small").textContent = read ? "Прочитано" : "Читать";
    button.setAttribute("aria-label", "Записка " + (index + 1) + (read ? ", прочитано" : ""));
  });
}
function renderCard() {
  $("cover-name").textContent = card.name;
  $("letter-title").textContent = card.name + ",";
  $("message").textContent = card.message;
  $("signature").textContent = card.signature;
  $("signature").hidden = !card.signature;
  $("photo").hidden = !card.photo;
  if (card.photo) $("photo").src = card.photo;
  else $("photo").removeAttribute("src");
  seen = new Set();
  renderProgress();
  show("cover", false);
}
card.notes.forEach((_, index) => {
  const button = document.createElement("button");
  button.className = "note";
  button.type = "button";
  const number = document.createElement("strong");
  number.textContent = String(index + 1).padStart(2, "0");
  button.append(number, document.createElement("small"));
  button.addEventListener("click", () => {
    seen.add(index);
    renderProgress();
    $("note-title").textContent = "Записка " + (index + 1) + " из " + card.notes.length;
    $("note-text").textContent = card.notes[index];
    noteDialog.showModal();
  });
  $("grid").append(button);

  const label = document.createElement("label");
  label.textContent = "Записка " + (index + 1);
  const input = document.createElement("textarea");
  input.name = "note" + index;
  input.rows = 2;
  input.maxLength = 180;
  label.append(input);
  $("note-fields").append(label);
});
$("open").addEventListener("click", () => {
  if (opening) return;
  opening = true;
  $("cover").classList.add("opening");
  const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 500;
  window.setTimeout(() => {
    $("cover").classList.remove("opening");
    opening = false;
    show("notes");
  }, delay);
});
$("close-note").onclick = $("next-note").onclick = () => noteDialog.close();
$("show-final").onclick = () => show("letter");
$("restart").onclick = () => {
  seen.clear();
  renderProgress();
  show("cover");
};
$("edit").onclick = () => {
  if (opening) return;
  form.elements.name.value = card.name;
  form.elements.message.value = card.message;
  form.elements.signature.value = card.signature;
  card.notes.forEach((note, index) => { form.elements["note" + index].value = note; });
  draftPhoto = card.photo;
  $("file").value = "";
  $("remove-photo").hidden = !draftPhoto;
  $("share").hidden = !/^https?:$/.test(location.protocol);
  $("manual-share").hidden = true;
  $("feedback").textContent = "";
  editor.showModal();
};
$("close-editor").onclick = () => editor.close();
editor.addEventListener("close", () => {
  photoRequest++;
  for (const button of form.querySelectorAll("[type=submit]")) button.disabled = false;
});
$("remove-photo").onclick = () => {
  draftPhoto = "";
  $("file").value = "";
  $("remove-photo").hidden = true;
  $("feedback").textContent = "Фото убрано.";
};
$("file").addEventListener("change", async () => {
  const file = $("file").files[0];
  if (!file) return;
  const request = ++photoRequest;
  const url = URL.createObjectURL(file);
  const buttons = form.querySelectorAll("[type=submit]");
  for (const button of buttons) button.disabled = true;
  $("remove-photo").hidden = true;
  $("feedback").textContent = "Подготавливаем фото…";
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    if (request !== photoRequest) return;
    const scale = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fffaf1";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    draftPhoto = canvas.toDataURL("image/jpeg", .82);
    $("feedback").textContent = "Фото добавлено.";
  } catch {
    if (request === photoRequest) $("feedback").textContent = "Не удалось открыть фото. Выбери JPG, PNG или WebP.";
  } finally {
    URL.revokeObjectURL(url);
    if (request === photoRequest) {
      $("remove-photo").hidden = !draftPhoto;
      for (const button of buttons) button.disabled = false;
    }
  }
});
form.addEventListener("submit", async event => {
  event.preventDefault();
  const fields = new FormData(form);
  const value = normalize({
    name:fields.get("name"),
    message:fields.get("message"),
    signature:fields.get("signature"),
    notes:defaults.notes.map((_, index) => fields.get("note" + index)),
    photo:draftPhoto
  });
  if (event.submitter?.id === "download") {
    original.dataset.letter = encode(value);
    const blob = new Blob(["<!doctype html>\n", original.outerHTML], {type:"text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "pismo-dlya-mamy.html";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    $("feedback").textContent = "Открытка готова к отправке.";
    return;
  }
  if (event.submitter?.id === "share") {
    const url = new URL(location.href);
    url.hash = "letter=" + encode({ ...value, photo:"" });
    try {
      await navigator.clipboard.writeText(url.href);
      $("manual-share").hidden = true;
      $("feedback").textContent = "Ссылка скопирована.";
    } catch {
      $("manual-share").hidden = false;
      $("share-url").value = url.href;
      $("share-url").select();
    }
    return;
  }
  card = value;
  editor.close();
  renderCard();
  $("cover-title").focus({preventScroll:true});
});
renderCard();
</script>
</body>
</html>
